[workspace]
members = ["crates/core", "crates/cli", "crates/providers", "crates/eval"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Apagafuegos/project-harness"

[workspace.dependencies]
unicode-segmentation = "1.13.3"
harness-core = { path = "crates/core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-stream = "0.3"
base64 = "0.22"
httpdate = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
imbl = { version = "7.0.2", default-features = false }
clap = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
rustix = { version = "1", features = ["fs", "process"] }
thiserror = "2"
jsonschema = { version = "0.46", default-features = false }
regex = "1"
ignore = "0.4"
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
pulldown-cmark = { version = "0.13", default-features = false }
# M7-06 decision 10: pure-Rust highlighting, bundled grammars, no C regex engine.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "dump-load", "regex-fancy"] }

# One development profile for check.sh, CI and ad-hoc cargo commands. Debug
# level and incremental mode are part of an artifact's identity, so any
# mismatch compiles and stores every crate twice. Workspace code keeps
# line-level debug information for backtraces; dependencies carry none, which
# makes every test binary cheaper to link. Incremental state is not cached.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Terminal and runtime cleanup must retain unwinding (ADR 0023).
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
