[workspace]
members = ["crates/core", "crates/cli", "crates/providers", "crates/eval"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
harness-core = { path = "crates/core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-stream = "0.3"
base64 = "0.22"
httpdate = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
imbl = { version = "7.0.2", default-features = false }
clap = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
rustix = { version = "1", features = ["fs", "process"] }
thiserror = "2"
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
pulldown-cmark = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
