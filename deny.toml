# Opt-in networked review: scripts/supply-chain.sh (not check.sh).
[advisories]
version = 2
# Informational only: syntect reads bundled trusted syntax dumps with bincode.
# No security vulnerability or patched version is reported (see audit report).
ignore = [{ id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is complete/unmaintained; syntect only decodes bundled trusted dumps" }]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Zlib", "Unlicense",
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
name = "imbl"
version = "=7.0.2"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "imbl-sized-chunks"
version = "=0.2.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
