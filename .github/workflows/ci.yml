name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        run: rustup toolchain install
      - name: Validate
        run: ./scripts/check.sh

  host-capabilities:
    # Milestone 3 step 1 spike: report what the runner offers the file tools
    # and the shell sandbox, before and after loading the committed AppArmor
    # profile (ADR 0008). Informational until the shell security suite exists:
    # it never fails the workflow. The profile changes the runner only.
    name: Host capabilities (harness doctor)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        run: rustup toolchain install
      - name: Install Bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Build
        run: cargo build --locked -p harness
      - name: Doctor as the runner comes
        run: |
          mkdir doctor
          ./target/debug/harness doctor > doctor/1-baseline.json
          jq .summary doctor/1-baseline.json
      - name: Load the committed AppArmor profile for bwrap
        run: |
          sudo apparmor_parser -r ci/apparmor/harness-ci-bwrap
          ./target/debug/harness doctor > doctor/2-with-profile.json
          jq .summary doctor/2-with-profile.json
      - name: Summary
        if: always()
        run: |
          for report in doctor/*.json; do
            echo "### $(basename "$report" .json)"
            echo '```json'
            jq '{summary, bubblewrap: {version: .bubblewrap.version, setuid: .bubblewrap.setuid, failures: .bubblewrap.failures, host_maps: .bubblewrap.probe.host_maps, stderr: .bubblewrap.probe.stderr}, cgroup: {bus_source: .cgroup.bus_source, reason: .cgroup.reason, stderr: .cgroup.probe.stderr}, host}' "$report"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-doctor
          path: doctor/
