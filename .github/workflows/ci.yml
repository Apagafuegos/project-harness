name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

# Provisioning below is the only network phase; validation is offline.
env:
  CARGO_NET_OFFLINE: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the repository toolchain
        run: rustup toolchain install
      - name: Install Bubblewrap and load the reviewed CI profile
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo apparmor_parser -r ci/apparmor/harness-ci-bwrap
          bwrap --version
      - name: Fetch locked dependencies (bootstrap only)
        run: CARGO_NET_OFFLINE=false cargo fetch --locked
      - name: Test release tooling (offline)
        run: ./scripts/with-offline-network.sh ./scripts/test-release.sh
      - name: Validate (including required S02 security suite)
        # Do not carry the runner's non-CLOEXEC pipe into the test harness.
        run: ./scripts/with-offline-network.sh ./scripts/with-clean-fds.sh ./scripts/check.sh

  host-capabilities:
    # Required real-Linux S02 gate, with before/after doctor evidence.
    # The reviewed profile changes the CI runner only (ADR 0008).
    name: Host sandbox security (S02)
    # Pinned: the AppArmor userns restriction is image-specific (ADR 0008).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the repository toolchain
        run: rustup toolchain install
      - name: Install Bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Fetch locked dependencies (bootstrap only)
        run: CARGO_NET_OFFLINE=false cargo fetch --locked
      - name: Build
        run: cargo build --locked -p harness
      - name: Doctor as the runner comes
        run: |
          mkdir doctor
          ./target/debug/harness doctor > doctor/1-baseline.json
          jq .summary doctor/1-baseline.json
      - name: Load the committed AppArmor profile for bwrap
        run: |
          sudo apparmor_parser -r ci/apparmor/harness-ci-bwrap
          ./target/debug/harness doctor > doctor/2-with-profile.json
          jq .summary doctor/2-with-profile.json
      - name: Required S02 security suite
        run: |
          bwrap --version
          ./scripts/with-offline-network.sh ./scripts/with-clean-fds.sh cargo test --locked -p harness-core --test sandbox -- --ignored --test-threads=1
          ./scripts/with-offline-network.sh ./scripts/with-clean-fds.sh cargo test --locked -p harness-core --test tool_host -- --ignored --test-threads=1
          ./scripts/with-offline-network.sh ./scripts/with-clean-fds.sh cargo test --locked -p harness --test doctor -- --ignored --test-threads=1
          ./scripts/with-offline-network.sh ./scripts/with-clean-fds.sh cargo test --locked -p harness-eval --test offline_gate -- --ignored --test-threads=1
      - name: Summary
        if: always()
        run: |
          for report in doctor/*.json; do
            echo "### $(basename "$report" .json)"
            echo '```json'
            jq '{summary, bubblewrap: {version: .bubblewrap.version, setuid: .bubblewrap.setuid, failures: .bubblewrap.failures, host_maps: .bubblewrap.probe.host_maps, stderr: .bubblewrap.probe.stderr}, cgroup: {bus_source: .cgroup.bus_source, reason: .cgroup.reason, stderr: .cgroup.probe.stderr}, host}' "$report"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: harness-doctor
          path: doctor/
