name: Supply chain (advisory)

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

jobs:
  supply-chain:
    # Separate from CI's required Rust workspace/S02 checks. Do not hide failure:
    # a red weekly run alerts maintainers without blocking the release gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install
      - name: Review locked dependencies (network explicitly enabled)
        run: ./scripts/supply-chain.sh --install
