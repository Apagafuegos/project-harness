[package]
name = "harness-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Explicitly opt-in tooling for scripts/live-check.sh; never records raw bytes.
live-recording = []

[dependencies]
harness-core.workspace = true
reqwest.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-stream.workspace = true
tokio.workspace = true
serde_json.workspace = true
base64.workspace = true
httpdate.workspace = true
rustix.workspace = true

[dev-dependencies]
harness-core = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }

[lints]
workspace = true
