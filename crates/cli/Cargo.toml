[package]
name = "harness"
description = "Terminal client for project-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Debug-only offline PTY fixtures; inert in release builds.
test-provider = []

[dependencies]
clap.workspace = true
toml = "0.8.23"
harness-core = { path = "../core" }
harness-providers = { path = "../providers" }
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
rustix.workspace = true
ratatui.workspace = true
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
futures-util.workspace = true
async-stream.workspace = true
pulldown-cmark.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
portable-pty = "0.9"

[lints]
workspace = true
